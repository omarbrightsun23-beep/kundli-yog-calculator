  <text x="154" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2.2" fill="#B45309">ROYAL HOROSCOPE &amp; YOGA ANALYZER</text>
